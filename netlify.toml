# GA Forum on Netlify. Static pages are built locally by scripts/build.py and committed;
# Netlify only bundles the functions (forum, form auto-reply).
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/lib/forum-seed.json"]

# Old vBulletin and WordPress URLs are in _redirects (generated from data/legacy-redirects.txt).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/facts/*"
  [headers.values]
    X-Robots-Tag = "noindex"
